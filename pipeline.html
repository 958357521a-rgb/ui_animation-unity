<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>资源批处理 · BUD UI Studio</title>
<!-- 资源批处理:Figma 插件发来的切图(或本地 PNG)→ AI 重绘 → 规则检查 → 配动效 → 生成 .unitypackage / 放回 Figma。
     逻辑在本地服务(dev/studio_server.py 的 /api/pipeline/*,核心 dev/pipeline/pipeline_core.py),这个页面只管展示和操作。
     http://localhost:8791/pipeline.html 或直接双击打开都行(双击打开时和工作台一样靠 dev/local_token_<端口>.js 的口令连本地服务)。 -->
<style>
  :root{--bg:#17171d;--panel:#1f1f28;--panel2:#26262f;--line:#34343f;--ink:#e8e8f0;--dim:#9a9aac;--acc:#8b7bff;--ok:#4cd07d;--warn:#ffb454;--err:#ff6b6b;}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--ink);font:13px/1.5 "Source Han Sans CN","思源黑体 CN","Noto Sans SC","Microsoft YaHei",sans-serif}
  body{display:flex;flex-direction:column;overflow:hidden}
  button{background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:5px 12px;cursor:pointer;font:inherit;white-space:nowrap}
  button:hover{border-color:var(--acc)} button.primary{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
  button[disabled]{opacity:.45;cursor:default}
  input,select{background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:5px;padding:4px 8px;font:inherit}
  input[type=checkbox]{width:auto}
  header{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line);flex:none;flex-wrap:wrap}
  header .logo{font-weight:800;color:var(--acc)}
  .chip{background:var(--panel2);border:1px solid var(--line);color:var(--dim);border-radius:99px;padding:2px 10px;font-size:12px;white-space:nowrap}
  .chip b{color:var(--ink);letter-spacing:1px}
  .grow{flex:1}
  main{flex:1;display:flex;min-height:0}
  aside{width:250px;flex:none;border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
  aside h4,section h4{font-size:12px;color:var(--dim);font-weight:600;margin:12px 12px 6px}
  #jobs{overflow:auto;flex:1}
  .job{padding:8px 12px;border-left:3px solid transparent;cursor:pointer}
  .job:hover{background:var(--panel2)} .job.on{background:var(--panel2);border-left-color:var(--acc)}
  .job .t{font-weight:600} .job .s{color:var(--dim);font-size:12px}
  .newjob{padding:10px 12px;border-top:1px solid var(--line);display:grid;gap:6px}
  .navc{margin:10px 10px 4px;text-align:left;font-weight:700}
  .navc.on{background:var(--acc);border-color:var(--acc);color:#fff}
  .grp{display:flex;align-items:center;gap:6px;padding:8px 12px 4px;color:var(--dim);font-size:12px;font-weight:700;cursor:pointer;user-select:none}
  .grp .cnt{font-weight:400} .grp .add{margin-left:auto;padding:0 7px;font-size:13px;line-height:18px}
  .grp .arr{display:inline-block;width:10px;transition:transform .15s} .grp.closed .arr{transform:rotate(-90deg)}
  .job.done .t{color:var(--dim)} .job.done .t::before{content:"✓ ";color:var(--ok)}
  .cbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
  .seg{display:flex;gap:2px} .seg button{border-color:transparent;background:none;color:var(--dim)} .seg button.on{background:var(--panel2);border-color:var(--line);color:var(--ink)}
  .csec{margin:6px 0 18px} .csec h3{font-size:14px;margin:0 0 8px;display:flex;align-items:baseline;gap:8px} .csec h3 .note{font-weight:400}
  .cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
  .ccard{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
  .ccard .cth{height:120px;background:repeating-conic-gradient(#2b2b35 0 25%,#23232c 0 50%) 0 0/14px 14px;display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer;color:var(--dim);font-size:12px}
  .ccard .cth img{max-width:100%;max-height:100%;object-fit:contain}
  .ccard .cbadge{position:absolute;left:8px;top:8px;font-size:11px;border-radius:99px;padding:1px 8px;background:#000a;color:#fff}
  .ccard .cbadge.done{background:var(--ok);color:#000} .ccard .cbadge.del{background:var(--err)}
  .ccard .cb{padding:8px 10px;display:grid;gap:2px;flex:1} .ccard .cn{font-weight:700;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ccard .cops{display:flex;flex-wrap:wrap;gap:4px;padding:0 10px 10px} .ccard .cops button{padding:3px 8px;font-size:12px}
  .ccard .cops .del{color:var(--err)}
  .cnew{border:1.5px dashed var(--line);border-radius:10px;min-height:120px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--dim);cursor:pointer;background:none}
  .cnew:hover{border-color:var(--acc);color:var(--ink)} .cnew b{font-size:22px;font-weight:300;color:var(--acc)}
  .crumb{display:flex;align-items:center;gap:6px;color:var(--dim);font-size:12px;margin-bottom:6px} .crumb a{color:var(--acc);cursor:pointer}
  #view{flex:1;overflow:auto;padding:14px 18px 40px}
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0 12px}
  .note{color:var(--dim);font-size:12px}
  .asset{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:14px;overflow:hidden}
  .ahead{display:flex;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .ahead .n{font-weight:700;font-size:14px}
  .abody{display:flex;gap:14px;padding:10px 12px;align-items:flex-start}
  .stage{flex:none;position:relative;background:repeating-conic-gradient(#2b2b35 0 25%,#23232c 0 50%) 0 0/16px 16px;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .stage .ly{position:absolute;transform-origin:50% 50%}
  .stage .ly img,.thumb img{width:100%;height:100%;display:block}
  .tintov{position:absolute;inset:0;mix-blend-mode:multiply;opacity:0;-webkit-mask-size:100% 100%;mask-size:100% 100%}
  table{border-collapse:collapse;width:100%}
  th{font-weight:600;color:var(--dim);font-size:12px;text-align:left;padding:4px 6px;border-bottom:1px solid var(--line)}
  td{padding:5px 6px;border-bottom:1px solid #2b2b35;vertical-align:middle}
  .thumb{width:56px;height:56px;background:repeating-conic-gradient(#2b2b35 0 25%,#23232c 0 50%) 0 0/10px 10px;border-radius:5px;overflow:hidden;display:flex;align-items:center;justify-content:center}
  .thumb img{object-fit:contain}
  .st{font-size:12px;border-radius:99px;padding:1px 8px;background:var(--panel2);color:var(--dim)}
  .st.done{color:var(--ok)} .st.failed{color:var(--err)} .st.running,.st.queued{color:var(--warn)}
  .iss{font-size:12px;margin-top:2px} .iss.error{color:var(--err)} .iss.warn{color:var(--warn)}
  .mot{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
  .mot input[type=number]{width:62px} .mot input[type=color]{width:34px;height:26px;padding:1px}
  .rp{width:100%;min-width:260px}
  #toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#000c;color:#fff;padding:8px 16px;border-radius:8px;display:none;max-width:80vw;z-index:9}
  dialog{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:16px;max-width:560px;width:90vw}
  dialog::backdrop{background:#0008}
  .pick{display:block;width:100%;text-align:left;margin-top:6px}
  .empty{color:var(--dim);padding:40px 0;text-align:center}
</style>
</head>
<body>
<header>
  <span class="logo">BUD UI Studio · 资源批处理</span>
  <span class="note">Figma 切图 → AI 重绘 → 规则检查 → 配动效 → unitypackage / 放回 Figma</span>
  <span class="grow"></span>
  <span class="chip" id="keyChip" title="Figma 插件「资源批处理」里填这个配对码;点一下复制">配对码 <b id="key">…</b></span>
  <span class="chip">主工程</span><input id="unityRoot" style="width:260px" placeholder="E:\BUDGCB\BUD_CHINA(含 Assets 的那层)">
  <button id="saveRoot">保存</button>
  <a href="BUD_UI_Studio.html"><button>← 回到工作台</button></a>
</header>
<main>
  <aside>
    <button class="navc" id="centerBtn" title="全部批处理任务:按类型归类,管理 / 编辑 / 复制 / 导出 / 删除">▦ 任务中心</button>
    <div id="jobs"></div>
    <div class="newjob"><button class="primary" id="nGo">＋ 新建任务</button></div>
  </aside>
  <section id="view"><div class="empty">加载中…</div></section>
</main>
<div id="toast"></div>
<dialog id="dlg"><div id="dlgBody"></div><div style="text-align:right;margin-top:12px"><button onclick="dlg.close()">关闭</button></div></dialog>
<input type="file" id="files" multiple accept=".png" hidden>
<input type="file" id="zipIn" accept=".zip" hidden>
<script>
const STUDIO_PORT = 8791;
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
let SVC = null, INFO = null, JOB = null, pollT = null, JOBS = [];
let CF = {status: "doing", type: "all", kw: ""};   // 任务中心的筛选
const toast = (t, ms) => { const e = $("#toast"); e.textContent = t; e.style.display = "block"; clearTimeout(e._t); e._t = setTimeout(() => e.style.display = "none", ms || 3500); };
const show = html => { $("#dlgBody").innerHTML = html; $("#dlg").showModal(); };
// 页面内的输入 / 确认框(内置浏览器面板会吞掉原生 prompt / confirm)
const ask = (title, def, okText) => new Promise(res => {
  show(`<b>${esc(title)}</b>${def != null ? `<input id="askIn" value="${esc(def)}" style="width:100%;margin-top:10px">` : ""}<div style="margin-top:12px"><button class="primary" id="askOk">${esc(okText || "确定")}</button></div>`);
  const done = v => { $("#dlg").close(); res(v); };
  $("#askOk").onclick = () => done(def != null ? $("#askIn").value.trim() : true);
  if (def != null){ $("#askIn").focus(); $("#askIn").onkeydown = e => { if (e.key === "Enter") $("#askOk").click(); }; }
  $("#dlg").addEventListener("close", () => res(null), {once: true});
});

// 本地服务:http 打开时同源;双击打开(file://)时读本机口令文件,和工作台「覆盖到 Unity」同一套
function service(){
  if (SVC) return Promise.resolve(SVC);
  if (location.protocol !== "file:") return Promise.resolve(SVC = {base: "", token: ""});
  return new Promise(res => {
    const s = document.createElement("script"), done = () => { s.remove(); const v = window.__BUDUI_SERVICE; res(SVC = v ? {base: `http://localhost:${v.port}`, token: v.token} : null); };
    window.__BUDUI_SERVICE = null; s.src = `dev/local_token_${STUDIO_PORT}.js`; s.onload = done; s.onerror = done; document.head.appendChild(s);
  });
}
async function api(action, body){
  const svc = await service();
  if (!svc) throw new Error("连不上本地服务:双击桌面「BUD UI Studio」(会在后台启动服务),再刷新这个页面");
  const r = await fetch(`${svc.base}/api/pipeline/${action}`, {method: "POST", headers: {"Content-Type": "application/json", "X-BudUI-Token": svc.token}, body: JSON.stringify(body || {})});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || `HTTP ${r.status}(服务是旧版的话重启一下)`);
  return j;
}
const run = async (fn, okText) => { try { const r = await fn(); if (okText) toast(okText); return r; } catch (e) { show(`<b style="color:var(--err)">没做成</b><p style="margin-top:8px">${esc(e.message)}</p>`); } };
const fileUrl = rel => `${SVC ? SVC.base : ""}/exports/pipeline/${JOB.id}/${encodeURI(rel)}?t=${encodeURIComponent(JOB.updated || "")}`;

// 内嵌在工作台任务首页「资源批处理」页签里(?embed=1):自己的顶栏隐藏,配对码 / 主工程路径交给工作台顶栏显示和保存
const EMBED = new URLSearchParams(location.search).has("embed");
// job:当前打开的批处理任务,工作台记下来,刷新后用 ?job= 重新打开
const tellParent = () => { if (EMBED && INFO) parent.postMessage({budui: "pipe-info", key: INFO.key, unityRoot: INFO.settings.unityRoot || "", job: JOB ? JOB.id : ""}, "*"); };
function rememberJob(){
  tellParent();
  if (!EMBED) try { history.replaceState(null, "", location.pathname + (JOB ? "?job=" + encodeURIComponent(JOB.id) : "")); } catch (e) {}
}
if (EMBED){
  document.querySelector("header").style.display = "none";
  addEventListener("message", async e => {
    const d = e.data; if (e.source !== parent || !d) return;
    if (d.budui === "pipe-saveRoot"){ $("#unityRoot").value = d.value || ""; $("#saveRoot").onclick(); }
    else if (d.budui === "pipe-reload") boot();
  });
}
async function boot(){
  INFO = await run(() => api("info"));
  if (!INFO) return;
  $("#key").textContent = INFO.key;
  $("#unityRoot").value = INFO.settings.unityRoot || "";
  tellParent();
  await loadJobs();
  if (!JOB) render();
  const want = new URLSearchParams(location.search).get("job");   // 刷新前打开的任务
  if (want && !JOB){ const r = await api("jobs").catch(() => null); if (r && r.items.some(j => j.id === want)) await openJob(want); }
}
$("#keyChip").onclick = () => navigator.clipboard.writeText(INFO.key).then(() => toast("配对码已复制,填进 Figma 插件「资源批处理」"));
$("#saveRoot").onclick = () => run(async () => { await api("settings", {settings: {unityRoot: $("#unityRoot").value}}); if (INFO){ INFO.settings.unityRoot = $("#unityRoot").value; tellParent(); } }, "主工程路径已保存");
$("#nGo").onclick = () => newJobDialog();
$("#centerBtn").onclick = () => goCenter();

// ---------- 任务中心:按类型归类,管理 / 编辑 / 复制 / 导出 / 删除(先进回收站) ----------
const stdOf = id => (INFO.standards.find(s => s.id === id) || {id, name: id});
const jobUrl = (id, rel, t) => `${SVC ? SVC.base : ""}/exports/pipeline/${id}/${encodeURI(rel)}${t ? "?t=" + encodeURIComponent(t) : ""}`;
const lsGet = k => { try { return localStorage.getItem(k) || ""; } catch (e) { return ""; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
async function loadJobs(){
  const r = await run(() => api("jobs")); if (!r) return;
  JOBS = r.items;
  const closed = lsGet("budui_pipe_closed").split(",");
  $("#centerBtn").classList.toggle("on", !JOB);
  $("#jobs").innerHTML = INFO.standards.map(st => {
    const js = JOBS.filter(j => j.standard === st.id && !j.deleted);
    const shut = closed.includes(st.id);
    return `<div class="grp ${shut ? "closed" : ""}" data-grp="${esc(st.id)}"><span class="arr">▾</span>${esc(st.name)}<span class="cnt">${js.length}</span>
        <button class="add" data-add="${esc(st.id)}" title="新建「${esc(st.name)}」任务">＋</button></div>`
      + (shut ? "" : js.map(j => `<div class="job ${JOB && JOB.id === j.id ? "on" : ""} ${j.status === "done" ? "done" : ""}" data-id="${j.id}"><div class="t">${esc(j.name)}</div>
          <div class="s">${j.mode === "new" ? "新增" : "替换"} · ${j.assets} 个资源 / ${j.slices} 张</div></div>`).join("")
        || `<div class="note" style="padding:0 12px 4px 28px">还没有任务</div>`);
  }).join("");
  $("#jobs").querySelectorAll(".job").forEach(e => e.onclick = () => openJob(e.dataset.id));
  $("#jobs").querySelectorAll("[data-grp]").forEach(e => e.onclick = ev => {
    if (ev.target.dataset.add) return newJobDialog(ev.target.dataset.add);
    const c = lsGet("budui_pipe_closed").split(",").filter(Boolean), id = e.dataset.grp;
    lsSet("budui_pipe_closed", (c.includes(id) ? c.filter(x => x !== id) : c.concat(id)).join(",")); loadJobs();
  });
  if (!JOB && $("#view").dataset.mode === "center") renderCenter();
}
function goCenter(type){
  JOB = null; clearTimeout(pollT);
  if (type) CF.type = type;
  render(); loadJobs(); rememberJob();
}
function newJobDialog(std){
  show(`<b>新建批处理任务</b>
    <div style="display:grid;gap:8px;margin-top:10px">
      <label class="note">类型<select id="njStd" style="width:100%;margin-top:2px">${INFO.standards.map(s => `<option value="${esc(s.id)}" ${s.id === (std || (CF.type !== "all" ? CF.type : "")) ? "selected" : ""}>${esc(s.name)}</option>`).join("")}</select></label>
      <label class="note">任务名<input id="njName" style="width:100%;margin-top:2px" placeholder="如:S10 头像框一批"></label>
      <label class="note">模式<select id="njMode" style="width:100%;margin-top:2px"><option value="new">新增(新编号的资源)</option><option value="replace">替换(原地换掉主工程里已有的图)</option></select></label>
      <label class="note">备注(可选)<input id="njNote" style="width:100%;margin-top:2px"></label>
      <button class="primary" id="njGo">新建</button></div>`);
  $("#njName").focus();
  $("#njGo").onclick = () => run(async () => {
    const j = await api("create", {name: $("#njName").value.trim(), standard: $("#njStd").value, mode: $("#njMode").value, note: $("#njNote").value.trim()});
    $("#dlg").close(); await loadJobs(); openJob(j.id);
  });
}
function editJobDialog(id){
  const j = JOBS.find(x => x.id === id) || JOB; if (!j) return;
  show(`<b>编辑任务信息</b><div style="display:grid;gap:8px;margin-top:10px">
      <label class="note">任务名<input id="ejName" value="${esc(j.name)}" style="width:100%;margin-top:2px"></label>
      <label class="note">备注<input id="ejNote" value="${esc(j.note || "")}" style="width:100%;margin-top:2px" placeholder="这批资源的说明、负责人、进度……"></label>
      <div class="note">类型:${esc(stdOf(j.standard).name)}(类型建好后不能改,要换类型就新建任务)</div>
      <button class="primary" id="ejGo">保存</button></div>`);
  $("#ejGo").onclick = () => run(async () => {
    const r = await api("update", {job: id, patch: {name: $("#ejName").value.trim() || j.name, note: $("#ejNote").value}});
    $("#dlg").close(); if (JOB && JOB.id === id){ JOB = r; render(); } await loadJobs();
  }, "已保存");
}
async function jobOp(op, id){
  const j = JOBS.find(x => x.id === id) || JOB;
  if (op === "open") return openJob(id);
  if (op === "edit") return editJobDialog(id);
  if (op === "dup") return run(async () => { const n = await api("duplicate", {job: id}); await loadJobs(); toast(`已复制成「${n.name}」`); });
  if (op === "done" || op === "undone") return run(async () => { const r = await api("update", {job: id, patch: {status: op === "done" ? "done" : "doing"}}); if (JOB && JOB.id === id){ JOB = r; render(); } await loadJobs(); });
  if (op === "trash") return run(async () => { await api("trash", {job: id}); if (JOB && JOB.id === id) goCenter(); else await loadJobs(); toast("已移到回收站(任务中心 → 回收站 可以恢复)"); });
  if (op === "restore") return run(async () => { await api("restore", {job: id}); await loadJobs(); toast("已恢复"); });
  if (op === "purge"){
    if (await ask(`彻底删除「${j ? j.name : id}」?原图、AI 新图、交付包都会删掉,不能恢复。`, null, "彻底删除")) run(async () => { await api("delete", {job: id}); await loadJobs(); });
    return;
  }
  if (op === "export") return exportDialog(id);
}
function exportDialog(id){
  const j = JOBS.find(x => x.id === id) || JOB, b = j && j.built;
  show(`<b>导出「${esc(j.name)}」</b>
    <div style="display:grid;gap:10px;margin-top:10px">
      <div><button class="primary" id="exZip">导出任务包(.zip)</button>
        <div class="note" style="margin-top:4px">原图、AI 新图、动效、配置字段、交付包都在里面;发给同事,对方在任务中心「导入任务」就能接着做。</div></div>
      <div>${b ? `<a href="${jobUrl(id, "build/" + b.file)}" download="${esc(b.file)}"><button>下载交付包 ${esc(b.file)}</button></a> <button id="exReveal">打开所在文件夹</button>
        <div class="note" style="margin-top:4px">上次生成 ${esc(b.time)};内容改过的话先打开任务「生成 unitypackage」再导出。</div>`
        : `<div class="note">还没生成交付包:打开任务 →「规则检查」→「生成 unitypackage」。</div>`}</div></div>`);
  $("#exZip").onclick = () => exportZip([id]);
  if (b) $("#exReveal").onclick = () => run(() => api("reveal", {job: id, what: "build"}));
}
function exportZip(ids){
  return run(async () => {
    const r = await api("export", {jobs: ids});
    show(`<b style="color:var(--ok)">✓ 已导出 ${r.jobs} 个任务</b><p class="note" style="margin-top:8px">${esc(r.path)}</p>

// ---------- 动效预览(CSS 近似 Unity 里的曲线:同周期、同幅度、同相位) ----------
let kfSeq = 0;
function motionCss(m, scale){
  const P = INFO.presets[m.preset]; if (!P) return {};
  const amp = +(m.amp != null && m.amp !== "" ? m.amp : P.amp), p = +(m.period || P.period), d = (+(m.delay || 0)) % p, name = "k" + (++kfSeq);
  let kf;
  if (m.preset === "sway") kf = `0%,100%{transform:rotate(0)}25%{transform:rotate(${-amp}deg)}75%{transform:rotate(${amp}deg)}`;   // Unity z 轴逆时针为正,CSS 顺时针为正
  else if (m.preset === "float") kf = `0%,50%,100%{transform:translateY(0)}25%{transform:translateY(${-amp * scale}px)}75%{transform:translateY(${amp * scale}px)}`;
  else if (m.preset === "shake") kf = `0%,50%,100%{transform:translateX(0)}25%{transform:translateX(${amp * scale}px)}75%{transform:translateX(${-amp * scale}px)}`;
  else if (m.preset === "breathe") kf = `0%,100%{transform:scale(1)}50%{transform:scale(${1 + amp})}`;
  else if (m.preset === "blink") kf = `0%,100%{opacity:1}50%{opacity:${1 - amp}}`;
  else if (m.preset === "tint") kf = `0%,100%{opacity:0}50%{opacity:${Math.min(1, amp)}}`;
  const sin = ["sway", "float", "shake"].includes(m.preset);
  const delay = -(sin ? (p - d) % p : (p - d) % p);
  return {kf: `@keyframes ${name}{${kf}}`, anim: `${name} ${p}s ${sin ? "linear" : "ease-in-out"} ${delay}s infinite`, tint: m.preset === "tint" ? (m.color || P.color) : null};
}

function slicePatch(tr, field, val){
  const a = JOB.assets[+tr.dataset.a], s = a.slices[+tr.dataset.s];
  let p = {};
  if (["preset", "amp", "period", "delay", "color"].includes(field)){
    if (field === "preset"){
      const P = INFO.presets[val];
      p.motion = val ? Object.assign({preset: val, amp: P.amp, period: P.period, delay: 0}, P.color ? {color: P.color} : {}) : null;
    } else p.motion = Object.assign({}, s.motion, {[field]: field === "color" ? val : +val});
  } else if (field === "border"){
    p.border = [...tr.querySelectorAll('[data-f="border"]')].map(i => +i.value || 0);
  } else p[field] = val;
  return {assets: {[a.name]: {slices: {[s.name]: p}}}};
}

  $("#aAi").onclick = () => run(async () => { const r = await api("ai", {job: JOB.id}); JOB = await api("job", {job: JOB.id}); render(); poll(); toast(`开始重绘 ${r.total} 张(本机 ComfyUI,每张约半分钟起)`); });
  $("#aCheck").onclick = () => run(async () => { JOB = await api("check", {job: JOB.id}); render(); }, "检查完了");
  $("#aBuild").onclick = () => run(async () => {
    const r = await api("build", {job: JOB.id}); JOB = await api("job", {job: JOB.id}); render();
    show(`<b style="color:var(--ok)">✓ 生成了交付包</b><p style="margin-top:8px">${r.assets} 个文件:<br><code>${esc(r.package)}</code></p>
      <p class="note" style="margin-top:8px">在 Unity 里双击它导入(或 Assets → Import Package → Custom Package)。说明在同目录 README.md。</p>
      ${r.configEntries.length ? `<p style="margin-top:8px">配置文件不会被改,要手动加这些条目(README 里也有):</p><pre class="note" style="white-space:pre-wrap">${esc(r.configEntries.map(e => JSON.stringify(e, null, 2)).join(",\n"))}</pre>` : ""}`);
  });
  $("#aPush").onclick = () => run(() => api("push", {job: JOB.id}), "已放进中转箱:到 Figma 插件「资源批处理」里点「取回处理结果」");
  document.querySelectorAll("input[data-aid]:not([data-field]):not([data-field-color])").forEach(i => i.onchange = () => run(async () => { const a = JOB.assets[+i.dataset.aid]; JOB = await api("update", {job: JOB.id, patch: {assets: {[a.name]: {id: i.value}}}}); render(); }));
  document.querySelectorAll("[data-field], [data-field-color]").forEach(i => i.onchange = () => run(async () => {
    const a = JOB.assets[+i.dataset.aid], key = i.dataset.field || i.dataset.fieldColor;
    JOB = await api("update", {job: JOB.id, patch: {assets: {[a.name]: {fields: {[key]: i.value}}}}}); render();
  }));
  document.querySelectorAll("tr[data-a] [data-f]").forEach(el => {
    const ev = el.type === "number" || el.classList.contains("rp") ? "change" : el.type === "color" ? "change" : "change";
    el.addEventListener(ev, () => {
      const tr = el.closest("tr"), f = el.dataset.f, v = el.type === "checkbox" ? el.checked : el.value;
      run(async () => { JOB = await api("update", {job: JOB.id, patch: slicePatch(tr, f, v)}); render(); });
    });
  });
}
$("#files").onchange = async e => {
  const fs = [...e.target.files]; if (!fs.length) return;
  const std = INFO.standards.find(s => s.id === JOB.standard) || {};
  const name = await ask(`这批切图属于哪个资源?(名字末尾带编号,如「${std.idHint || "头像框_40"}」)`, fs.length === 1 ? fs[0].name.replace(/\.png$/i, "") : "");
  if (!name) return;
  const files = await Promise.all(fs.map(f => new Promise(res => { const r = new FileReader(); r.onload = () => res({name: f.name, b64: r.result.split(",")[1]}); r.readAsDataURL(f); })));
  run(async () => { JOB = await api("upload", {job: JOB.id, name, files}); render(); loadJobs(); }, `已加入 ${files.length} 张`);
};
boot();
</script>
</body>
</html>
